name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Creating a release starts this job, but it now WAITS for a human. The `npm-publish`
    # environment requires a review from Mirko Tochtermann or Oliver Rasch before any step runs.
    # Publishing authenticates by OIDC trusted publishing, so there is no token to revoke - the
    # only control over what reaches npmjs.org is who may approve this deployment.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --access public --provenance