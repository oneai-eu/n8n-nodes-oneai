name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Creating a release starts this job, but it now WAITS for a human. The `npm-publish`
    # environment requires a review from Mirko Tochtermann or Oliver Rasch before any step runs.
    # Publishing authenticates by OIDC trusted publishing, so there is no token to revoke - the
    # only control over what reaches npmjs.org is who may approve this deployment.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm publish --access public --provenance